trust-remote-code: true
enforce-eager: true
num-gpus: 2
task-type: ref2va
#quantization: fp8
vae-use-tiling: true
# Use rotating rank-local buffers and stage the native video/audio VAEs.
# The compact dit/text_encoder selector keeps those large VAEs resident.
enable-distributed-layerwise-offload: true
dlo-no-use-allgather: true

# add by sunjian
vae-patch-parallel-size: 2
tensor-parallel-size: 2
usp: 1
ring: 1
text-encoder-tp-size: 2
vae-patch-parallel-size: 2
dlo-resident-layers: 30

diffusion-attention-config:
  default:
    backend: FASTVIDEO_VSA
    fastvideo_vsa_provider: cudnn #triton
default-sampling-params:
  "0":
    num_inference_steps: 8
    guidance_scale: 1
init-timeout: 3600
stage-init-timeout: 3600
